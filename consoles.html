<body class="font-body bg-dark text-slate-300 antialiased selection:bg-primary selection:text-white min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="fixed w-full top-0 z-50 bg-dark/95 backdrop-blur-lg border-b border-white/5 h-16 sm:h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex justify-between items-center">
            <a href="index.html" class="font-heading font-bold text-xl sm:text-2xl tracking-widest text-white uppercase">
                WARAX<span class="text-primary">GAMING</span>
            </a>
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="index.html" class="text-slate-400 hover:text-white text-xs sm:text-sm font-semibold uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Main Store</span>
                </a>
                <button onclick="openPayUCheckout()" class="text-slate-400 hover:text-white relative p-2">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-count-badge" class="cart-count-badge absolute top-0 right-0 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-dark">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="pt-24 sm:pt-32 pb-16 flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Page Title -->
            <div class="mb-10 text-center sm:text-left">
                <span class="text-primary font-bold text-xs uppercase tracking-widest block mb-1">Official Gaming Hardware</span>
                <h1 class="font-heading font-black text-3xl sm:text-4xl text-white tracking-tight uppercase">Gaming Consoles Collection</h1>
                <p class="text-slate-400 text-xs sm:text-sm mt-1 max-w-xl">PlayStation 5, Xbox Series X/S, Nintendo Switch, Retro & Handheld PCs with guaranteed discount deals.</p>
            </div>

            <!-- Filters Bar (No numbers displayed) -->
            <div class="bg-surface border border-white/10 p-6 rounded-2xl mb-10 space-y-5">
                <div class="relative">
                    <input type="text" id="console-search" oninput="renderConsoles()" placeholder="Search console model (PS5, Xbox, Switch OLED, Steam Deck...)..." 
                           class="w-full bg-dark border border-white/10 rounded-xl py-3 pl-11 pr-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-primary">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-500 text-xs"></i>
                </div>

                <div class="flex flex-wrap gap-2" id="brand-filters">
                    <button onclick="filterBrand('ALL')" id="brand-ALL" class="brand-btn px-4 py-1.5 border border-primary bg-primary text-white text-xs font-bold uppercase rounded-lg">All Consoles</button>
                    <button onclick="filterBrand('Sony')" id="brand-Sony" class="brand-btn px-4 py-1.5 border border-white/10 text-slate-300 hover:text-white text-xs font-bold uppercase rounded-lg">PlayStation</button>
                    <button onclick="filterBrand('Microsoft')" id="brand-Microsoft" class="brand-btn px-4 py-1.5 border border-white/10 text-slate-300 hover:text-white text-xs font-bold uppercase rounded-lg">Xbox</button>
                    <button onclick="filterBrand('Nintendo')" id="brand-Nintendo" class="brand-btn px-4 py-1.5 border border-white/10 text-slate-300 hover:text-white text-xs font-bold uppercase rounded-lg">Nintendo</button>
                </div>
            </div>

            <!-- Consoles Grid -->
            <div id="consoles-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Dynamically populated -->
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-slate-400 py-10 border-t border-white/5">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
            <span class="font-heading font-bold text-white uppercase tracking-widest">WARAX<span class="text-primary">GAMING</span></span>
            <span>&copy; 2026 WARAX GAMING • All Rights Reserved</span>
            <a href="index.html" class="text-primary font-semibold uppercase">Main Store &rarr;</a>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="products.js"></script>
    <script src="payu-checkout.js"></script>
    <script>
        let currentBrand = 'ALL';

        document.addEventListener('DOMContentLoaded', () => {
            renderConsoles();
        });

        function filterBrand(b) {
            currentBrand = b;
            document.querySelectorAll('.brand-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'border-primary', 'text-white');
                btn.classList.add('border-white/10', 'text-slate-300');
            });
            const activeBtn = document.getElementById(`brand-${b}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-primary', 'border-primary', 'text-white');
                activeBtn.classList.remove('border-white/10', 'text-slate-300');
            }
            renderConsoles();
        }

        function renderConsoles() {
            const grid = document.getElementById('consoles-grid');
            if (!grid || typeof PRODUCTS_DATA === 'undefined') return;

            const q = document.getElementById('console-search') ? document.getElementById('console-search').value.toLowerCase().trim() : '';

            const list = PRODUCTS_DATA.filter(p => p.sheetCategory === 'Consoles');

            let filtered = list.filter(item => {
                let matchBrand = true;
                if (currentBrand !== 'ALL') {
                    matchBrand = item.brand === currentBrand;
                }
                let matchSearch = !q || item.name.toLowerCase().includes(q) || (item.brand && item.brand.toLowerCase().includes(q));
                return matchBrand && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-500">
                        <i class="fa-solid fa-gamepad text-4xl mb-3"></i>
                        <p class="text-xs">No consoles found matching your query.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const discPct = item.discount || Math.round(((item.originalPrice - item.price) / item.originalPrice) * 100);
                return `
                <a href="product.html?id=${item.id}" class="bg-surface border border-white/5 hover-lift p-5 rounded-2xl flex flex-col justify-between group no-underline text-left">
                    <div>
                        <div class="aspect-square bg-dark rounded-xl overflow-hidden mb-4 relative flex items-center justify-center p-4">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-500" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1606813907291-d86efa9b94db?q=80&w=800&auto=format&fit=crop'">
                            <div class="absolute top-3 left-3 bg-green-600 text-white font-black text-[11px] px-2.5 py-1 rounded-md shadow-md z-10">${discPct}% OFF</div>
                        </div>
                        <span class="text-[10px] text-primary font-bold uppercase tracking-widest block mb-1">${item.brand} • ${item.sheetCategory}</span>
                        <h3 class="font-heading font-bold text-white text-base leading-snug line-clamp-1 group-hover:text-primary transition">${item.name}</h3>
                    </div>
                    <div class="mt-4 pt-4 border-t border-white/5 flex items-center justify-between">
                        <div>
                            <span class="font-heading font-black text-lg text-white">₹${item.price.toLocaleString('en-IN')}</span>
                            ${item.originalPrice ? `<span class="text-slate-500 line-through text-xs ml-1.5">₹${item.originalPrice.toLocaleString('en-IN')}</span>` : ''}
                        </div>
                        <button onclick="event.preventDefault(); event.stopPropagation(); addToCart(${item.id})" class="w-9 h-9 bg-white/5 hover:bg-primary text-white rounded-lg flex items-center justify-center transition">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                </a>
            `}).join('');
        }
    </script>
</body>
</html>
