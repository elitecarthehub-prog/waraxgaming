<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Controllers & Arcade Sticks | WARAX GAMING</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Inter', 'sans-serif'] },
                    colors: { primary: '#991b1b', primaryHover: '#7f1d1d', dark: '#09090b', surface: '#18181b', surfaceHover: '#27272a' },
                    boxShadow: { 'glow': '0 0 40px -10px rgba(153, 27, 27, 0.4)' }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .hover-lift { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-4px); }
        .btn-anim { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-anim:active { transform: scale(0.96); }
    </style>
</head>
<body class="font-body bg-dark text-slate-300 antialiased selection:bg-primary selection:text-white min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="fixed w-full top-0 z-50 bg-dark/95 backdrop-blur-lg border-b border-white/5 h-16 sm:h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex justify-between items-center">
            <a href="index.html" class="font-heading font-bold text-xl sm:text-2xl tracking-widest text-white uppercase">
                WARAX<span class="text-primary">GAMING</span>
            </a>
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="index.html" class="text-slate-400 hover:text-white text-xs sm:text-sm font-semibold uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Main Store</span>
                </a>
                <button onclick="openPayUCheckout()" class="text-slate-400 hover:text-white relative p-2">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-count-badge" class="cart-count-badge absolute top-0 right-0 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-dark">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="pt-24 sm:pt-32 pb-16 flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Page Title -->
            <div class="mb-10 text-center sm:text-left">
                <span class="text-primary font-bold text-xs uppercase tracking-widest block mb-1">Wireless Controllers & Fight Sticks</span>
                <h1 class="font-heading font-black text-3xl sm:text-4xl text-white tracking-tight uppercase">Controllers Collection</h1>
                <p class="text-slate-400 text-xs sm:text-sm mt-1 max-w-xl">DualSense, Xbox Wireless, Joy-Cons, Pro Controllers & Arcade Fightsticks with up to 40% OFF discount deals.</p>
            </div>

            <!-- Controllers Grid -->
            <div id="controllers-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Dynamically populated -->
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-slate-400 py-10 border-t border-white/5">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
            <span class="font-heading font-bold text-white uppercase tracking-widest">WARAX<span class="text-primary">GAMING</span></span>
            <span>&copy; 2026 WARAX GAMING • All Rights Reserved</span>
            <a href="index.html" class="text-primary font-semibold uppercase">Main Store &rarr;</a>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="products.js"></script>
    <script src="payu-checkout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderControllers();
        });

        function renderControllers() {
            const grid = document.getElementById('controllers-grid');
            if (!grid || typeof PRODUCTS_DATA === 'undefined') return;

            const list = PRODUCTS_DATA.filter(p => p.sheetCategory === 'Controllers');

            grid.innerHTML = list.map(item => {
                const discPct = item.discount || Math.round(((item.originalPrice - item.price) / item.originalPrice) * 100);
                return `
                <a href="product.html?id=${item.id}" class="bg-surface border border-white/5 hover-lift p-5 rounded-2xl flex flex-col justify-between group no-underline text-left">
                    <div>
                        <div class="aspect-square bg-dark rounded-xl overflow-hidden mb-4 relative flex items-center justify-center p-3">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-500" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1592840496694-26d035b52b48?q=80&w=800&auto=format&fit=crop'">
                            <div class="absolute top-3 left-3 bg-green-600 text-white font-black text-[11px] px-2.5 py-1 rounded-md shadow-md z-10">${discPct}% OFF</div>
                        </div>
                        <span class="text-[10px] text-primary font-bold uppercase tracking-widest block mb-1">${item.brand} • ${item.sheetCategory}</span>
                        <h3 class="font-heading font-bold text-white text-base leading-snug line-clamp-1 group-hover:text-primary transition">${item.name}</h3>
                    </div>
                    <div class="mt-4 pt-4 border-t border-white/5 flex items-center justify-between">
                        <div>
                            <span class="font-heading font-black text-lg text-white">₹${item.price.toLocaleString('en-IN')}</span>
                            ${item.originalPrice ? `<span class="text-slate-500 line-through text-xs ml-1.5">₹${item.originalPrice.toLocaleString('en-IN')}</span>` : ''}
                        </div>
                        <button onclick="event.preventDefault(); event.stopPropagation(); addToCart(${item.id})" class="w-9 h-9 bg-white/5 hover:bg-primary text-white rounded-lg flex items-center justify-center transition">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                </a>
            `}).join('');
        }
    </script>
</body>
</html>
