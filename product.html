<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Product Details | WARAX GAMING</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Inter', 'sans-serif'] },
                    colors: { primary: '#991b1b', primaryHover: '#7f1d1d', dark: '#09090b', surface: '#18181b', surfaceHover: '#27272a' },
                    boxShadow: { 'glow': '0 0 40px -10px rgba(153, 27, 27, 0.4)' }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .hover-lift { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-4px); }
        .btn-anim { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-anim:active { transform: scale(0.96); }
        .badge-pulse { animation: badgePulse 2s ease-in-out infinite; }
        @keyframes badgePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
<!-- Meta Pixel Code -->

</script>
<noscript><img height="1" width="1" style="display:none"

/></noscript>
<!-- End Meta Pixel Code -->
</head>
<body class="font-body bg-dark text-slate-300 antialiased selection:bg-primary selection:text-white min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="fixed w-full top-0 z-50 bg-dark/95 backdrop-blur-lg border-b border-white/5 h-16 sm:h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex justify-between items-center">
            <a href="index.html" class="font-heading font-bold text-xl sm:text-2xl tracking-widest text-white uppercase">
                WARAX<span class="text-primary">GAMING</span>
            </a>
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="track.html" class="text-green-400 hover:text-green-300 text-xs sm:text-sm font-semibold uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-truck-fast"></i> <span class="hidden sm:inline">Track Order</span>
                </a>
                <a href="index.html" class="text-slate-400 hover:text-white text-xs sm:text-sm font-semibold uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Main Store</span>
                </a>
                <button onclick="openCartDrawer()" class="text-slate-400 hover:text-white relative p-2">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-count-badge" class="cart-count-badge absolute top-0 right-0 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-dark">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="pt-24 sm:pt-32 pb-16 flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" id="product-container">
            <!-- Loading state -->
            <div class="text-center py-24 space-y-3">
                <div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-slate-400 text-xs uppercase tracking-widest">Loading Product Details...</p>
            </div>
        </div>

        <!-- Related Products Section -->
        <section class="mt-16 py-12 bg-surface/50 border-t border-white/5" id="related-section" style="display:none;">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <h2 class="font-heading text-xl font-bold text-white mb-6 uppercase tracking-wider">Related Products</h2>
                <div id="related-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-slate-400 py-10 border-t border-white/5">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
            <span class="font-heading font-bold text-white uppercase tracking-widest">WARAX<span class="text-primary">GAMING</span></span>
            <span>&copy; 2026 WARAX GAMING • All Rights Reserved</span>
            <a href="index.html" class="text-primary font-semibold uppercase">Main Store &rarr;</a>
        </div>
    </footer>

    <script src="products.js"></script>
    <script src="payu-checkout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            let pid = parseInt(urlParams.get('id'));
            
            if (!pid && typeof PRODUCTS_DATA !== 'undefined' && PRODUCTS_DATA.length > 0) {
                pid = PRODUCTS_DATA[0].id;
            }

            const p = PRODUCTS_DATA ? PRODUCTS_DATA.find(item => item.id === pid) : null;

            if (!p) {
                document.getElementById('product-container').innerHTML = `
                    <div class="text-center py-20 space-y-4">
                        <i class="fa-solid fa-gamepad text-5xl text-primary mb-2"></i>
                        <h2 class="font-heading font-bold text-2xl text-white">Product Not Found</h2>
                        <p class="text-slate-400 text-xs">The requested product could not be located in our catalog.</p>
                        <a href="index.html" class="inline-block px-6 py-3 bg-primary text-white font-bold text-xs uppercase tracking-widest rounded-xl">Return to Main Store</a>
                    </div>
                `;
                return;
            }

            document.title = `${p.name} | WARAX GAMING`;

            if (typeof fbq === 'function') {
                fbq('track', 'ViewContent', {
                    content_ids: [String(p.id)],
                    content_name: p.name,
                    content_type: 'product',
                    value: p.price,
                    currency: 'INR'
                });
            }

            const origPrice = p.originalPrice || p.price;
            const discount = p.discount || 0;
            const savings = origPrice - p.price;

            const html = `
                <!-- Breadcrumb -->
                <div class="flex items-center gap-2 text-[11px] text-slate-500 mb-8 flex-wrap">
                    <a href="index.html" class="hover:text-white">Store</a>
                    <span>/</span>
                    <span class="text-slate-400">${p.sheetCategory || p.category}</span>
                    <span>/</span>
                    <span class="text-white font-semibold">${p.name}</span>
                </div>

                <!-- Product Content Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 sm:gap-16 items-start">
                    
                    <!-- Left Column: Image -->
                    <div class="space-y-4">
                        <div class="bg-surface border border-white/10 rounded-2xl overflow-hidden aspect-square relative flex items-center justify-center p-6 group">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=800&auto=format&fit=crop'">
                            ${discount > 0 ? `<div class="absolute top-4 left-4 bg-green-600 text-white font-heading font-black text-sm px-3.5 py-1.5 rounded-xl shadow-lg badge-pulse">${discount}% OFF</div>` : ''}
                            <div class="absolute top-4 right-4 bg-green-500/20 border border-green-500/30 text-green-400 font-bold text-[10px] px-3 py-1 rounded-lg uppercase tracking-wider backdrop-blur-md flex items-center gap-1">
                                <i class="fa-solid fa-truck-fast"></i> FREE Delivery
                            </div>
                        </div>

                        <!-- Trust Badges -->
                        <div class="grid grid-cols-3 gap-3 text-center">
                            <div class="bg-surface border border-white/5 rounded-xl p-3.5">
                                <i class="fa-solid fa-truck-fast text-green-400 text-xl mb-1.5"></i>
                                <p class="text-[11px] font-bold text-white uppercase">FREE Delivery</p>
                                <p class="text-[9px] text-slate-500">All India Express</p>
                            </div>
                            <div class="bg-surface border border-white/5 rounded-xl p-3.5">
                                <i class="fa-solid fa-shield-halved text-primary text-xl mb-1.5"></i>
                                <p class="text-[11px] font-bold text-white uppercase">256-Bit SSL</p>
                                <p class="text-[9px] text-slate-500">100% Secure Checkout</p>
                            </div>
                            <div class="bg-surface border border-white/5 rounded-xl p-3.5">
                                <i class="fa-solid fa-rotate-left text-green-400 text-xl mb-1.5"></i>
                                <p class="text-[11px] font-bold text-white uppercase">7-Day Return</p>
                                <p class="text-[9px] text-slate-500">Easy Replacement</p>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Details & Pricing -->
                    <div class="space-y-6">
                        <div>
                            <span class="text-primary font-extrabold text-[11px] uppercase tracking-widest block mb-1">${p.brand || 'WARAX'} • ${p.sheetCategory || p.category}</span>
                            <h1 class="font-heading font-black text-3xl sm:text-4xl text-white tracking-tight leading-tight">${p.name}</h1>
                            ${p.compatibility ? `<p class="text-slate-400 text-xs sm:text-sm mt-2">Platform / Compatibility: <span class="text-white font-bold">${p.compatibility}</span></p>` : ''}
                        </div>

                        <!-- Ratings -->
                        <div class="flex items-center gap-3">
                            <div class="flex text-amber-400 text-sm">
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star-half-stroke"></i>
                            </div>
                            <span class="text-slate-400 text-xs font-medium">4.9 / 5 • Verified Gamer Deal</span>
                        </div>

                        <!-- Highlighted Price Box -->
                        <div class="bg-surface border border-white/10 rounded-2xl p-6 space-y-3 shadow-xl">
                            <div class="flex items-end gap-4 flex-wrap">
                                <span class="font-heading font-black text-4xl sm:text-5xl text-white">₹${p.price.toLocaleString('en-IN')}</span>
                                ${origPrice > p.price ? `
                                <div class="flex flex-col">
                                    <span class="text-slate-500 line-through text-lg">₹${origPrice.toLocaleString('en-IN')}</span>
                                    <span class="text-green-400 font-extrabold text-sm flex items-center gap-1">
                                        <i class="fa-solid fa-tags text-xs"></i> You Save ₹${savings.toLocaleString('en-IN')} (${discount}% OFF)
                                    </span>
                                </div>` : ''}
                            </div>
                            <p class="text-[11px] text-slate-500">Inclusive of all taxes. 🚚 FREE express shipping across India.</p>
                            <div class="flex items-center gap-2 pt-1">
                                <span class="w-2.5 h-2.5 rounded-full bg-green-400 inline-block animate-pulse"></span>
                                <span class="text-green-400 text-xs font-bold">In Stock — Ready to Dispatch</span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-col sm:flex-row gap-4 pt-2">
                            <button onclick="addToCart(${p.id})" class="btn-anim flex-1 min-h-[54px] bg-primary hover:bg-primaryHover text-white font-bold text-xs uppercase tracking-widest rounded-xl flex items-center justify-center gap-3 shadow-glow">
                                <i class="fa-solid fa-cart-plus text-base"></i>
                                Add to Cart
                            </button>
                            <button onclick="addToCart(${p.id}, false); window.location.href='checkout.html';" class="btn-anim flex-1 min-h-[54px] bg-green-600 hover:bg-green-700 text-white font-bold text-xs uppercase tracking-widest rounded-xl flex items-center justify-center gap-3 shadow-lg">
                                <i class="fa-solid fa-bolt text-base"></i>
                                Buy Now (FREE Delivery)
                            </button>
                        </div>

                        <!-- Specifications Table -->
                        <div class="border border-white/10 rounded-2xl overflow-hidden mt-6">
                            <div class="bg-surface px-5 py-3 border-b border-white/10">
                                <h3 class="font-heading font-bold text-white text-xs uppercase tracking-wider">Product Specifications</h3>
                            </div>
                            <div class="divide-y divide-white/5 bg-dark/40">
                                <div class="flex justify-between items-center px-5 py-3 text-xs">
                                    <span class="text-slate-400 font-medium">Brand</span>
                                    <span class="text-white font-bold">${p.brand || 'WARAX'}</span>
                                </div>
                                <div class="flex justify-between items-center px-5 py-3 text-xs">
                                    <span class="text-slate-400 font-medium">Category</span>
                                    <span class="text-white font-bold">${p.sheetCategory || p.category}</span>
                                </div>
                                ${p.compatibility ? `
                                <div class="flex justify-between items-center px-5 py-3 text-xs">
                                    <span class="text-slate-400 font-medium">Compatibility</span>
                                    <span class="text-white font-bold">${p.compatibility}</span>
                                </div>` : ''}
                                <div class="flex justify-between items-center px-5 py-3 text-xs">
                                    <span class="text-slate-400 font-medium">Delivery</span>
                                    <span class="text-green-400 font-bold">FREE Express Delivery</span>
                                </div>
                                <div class="flex justify-between items-center px-5 py-3 text-xs">
                                    <span class="text-slate-400 font-medium">Discount Deal</span>
                                    <span class="text-green-400 font-bold">${discount}% OFF</span>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;

            document.getElementById('product-container').innerHTML = html;

            // Render Related
            const related = PRODUCTS_DATA.filter(item => item.sheetCategory === p.sheetCategory && item.id !== p.id).slice(0, 4);
            if (related.length > 0) {
                document.getElementById('related-section').style.display = 'block';
                document.getElementById('related-grid').innerHTML = related.map(item => `
                    <a href="product.html?id=${item.id}" class="bg-surface border border-white/5 hover-lift p-4 rounded-xl flex flex-col group">
                        <div class="aspect-square bg-dark rounded-lg overflow-hidden mb-3 relative">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            ${item.discount ? `<div class="absolute top-2 left-2 bg-green-600 text-white text-[9px] font-black px-2 py-0.5 rounded">${item.discount}% OFF</div>` : ''}
                        </div>
                        <span class="text-[10px] text-primary font-bold uppercase tracking-wider">${item.brand}</span>
                        <h4 class="font-heading font-semibold text-white text-xs mt-0.5 leading-snug line-clamp-2 group-hover:text-primary transition">${item.name}</h4>
                        <div class="mt-2 flex items-center gap-2">
                            <span class="font-heading font-bold text-sm text-white">₹${item.price.toLocaleString('en-IN')}</span>
                            ${item.originalPrice ? `<span class="text-slate-500 line-through text-[10px]">₹${item.originalPrice.toLocaleString('en-IN')}</span>` : ''}
                        </div>
                    </a>
                `).join('');
            }
        });
    </script>
</body>
</html>
